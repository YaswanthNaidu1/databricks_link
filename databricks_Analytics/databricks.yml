# This is a Declarative Automation Bundle definition for databricks_Analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_Analytics
  uuid: 37b1a6a5-957c-4bf8-bcf5-7a08bc400da0

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b8e3fd96-c1d4.cloud.databricks.com
    variables:
      catalog: dev_catalog
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-b8e3fd96-c1d4.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ynaidu473@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ynaidu473@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_catalog
      schema: prod
    permissions:
      - user_name: ynaidu473@gmail.com
        level: CAN_MANAGE
